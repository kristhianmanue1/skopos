schema: pinax/project-manifest/v1
id: skopos
proposito: >
  Memoria observable de sesiones de CLIs de IA: captura de turnos, análisis
  temático local con Ollama, almacenamiento consultable en MongoDB local,
  recuperación por tema y vigilante en vivo, con acceso al fragmento completo
  de origen cuando hace falta.
consumidor_principal: agente

ofrece:
  - captura de turnos de CLIs de IA hacia documentos estructurados (SPEC-001)
  - >-
    análisis temático con LLM (SPEC-002; ADR-014): Ollama local por defecto,
    proveedor configurable por entorno vía API compatible-OpenAI — un
    proveedor remoto sólo con decreto explícito del dueño y saca el contenido
    de la máquina
  - almacenamiento consultable en MongoDB local (SPEC-003)
  - recuperación por tema por CLI, con acceso al fragmento completo de origen (SPEC-004)
  - vigilante en vivo con arranque "desde ahora" y backfill explícito (SPEC-005, ADR-008)
  - reanálisis de un turno con supersede explícito (ADR-007)
  - >-
    análisis de turnos ya indexados que aún no lo tienen (ADR-017);
    no toca los que ya tienen análisis — eso es reanalizar
  - pipeline verificado con datos reales (28 turnos, ~19.6 s/turno, 0 fallos)
  - contratos de parser por CLI aceptados (ADR-010 + SPEC-006) como base de la extensión multi-CLI

no_ofrece:
  - >-
    fuente para sesiones de prime-agent (hoy sin parser; la ampliación
    multi-CLI ya está implementada para codex-cli, claude-code, opencode,
    cline y kimi-code — hito 18, cerrado el 2026-08-28; prime-agent sigue
    pendiente en el issue #1, y qwen-code diferido por decisión del dueño)
  - retención, expiración ni borrado selectivo de lo capturado
  - redacción garantizada de secretos en fragmento_completo (evidencia cruda por diseño)
  - búsqueda semántica (la recuperación usa $text de MongoDB, ADR-006)
  - garantía de exactitud del análisis producido por el LLM local
  - ejecución de código o intervención sobre los CLIs observados

publica:
  - { tipo: contrato, id: skopos/rollout-jsonl-de-codex, version: v1 }
  - { tipo: contrato, id: skopos/documento-turno-mongo, version: v2 }
  - { tipo: contrato, id: skopos/documento-analisis-mongo, version: v2 }
  - { tipo: contrato, id: skopos/config-dominio, version: v1 }
  - { tipo: contrato, id: skopos/cli-skopos-query, version: v1 }
  - { tipo: contrato, id: skopos/cli-skopos-buscar, version: v1 }
  - { tipo: contrato, id: skopos/cli-skopos-reanalizar, version: v1 }
  - { tipo: contrato, id: skopos/cli-skopos-analyze, version: v1 }
  - { tipo: contrato, id: skopos/consulta-escrubery-cli, version: v1 }

consume:
  - { tipo: externo, id: mongodb-local, uso: "almacenamiento de turnos y análisis; instalación y operación locales", requerido: true }
  - { tipo: externo, id: ollama-local, uso: "proveedor de análisis por defecto (qwen3:8b); sustituible conforme a ADR-014, no necesario para indexar o buscar", requerido: false }
  - { tipo: proyecto, id: escrubery, uso: "canal alternativo de obtención de conversaciones (REQ-10); ensayo registrado en el hito 10, no implica operación continua", requerido: false }

fronteras_de_confianza:
  - el análisis temático es salida de un LLM y no se verifica contra el fragmento de origen
  - proveedor del análisis local por defecto (Ollama); remoto sólo por decreto
    del dueño y con la API key fuera del repo (ADR-014 §c)
  - fragmento_completo conserva el texto original sin redactar; la redacción de secretos es defensa por patrón sólo en campos derivados
  - watch procesa sólo turnos cerrados desde su arranque; el histórico exige backfill explícito
  - el soporte de codex-cli, claude-code, cline, kimi-code y opencode está implementado; cada parser nuevo requiere su propia verificación
  - "query comprueba longitud y sello cuando existe; admite legado sin sello marcado sellado:false. P-007 sigue sin reparación aprobada"
  - search devuelve texto indexado redactado y acotado, sin releer el origen ni verificar su sello
  - lo capturado incluye rutas absolutas y se almacena localmente; un proveedor remoto autorizado puede recibir entradas del análisis (ADR-014)

pospuesto:
  - ampliación a conversaciones de otros orígenes; prime-agent pendiente y qwen-code diferido
  - lectura por sesión, fecha o rango
  - borrado selectivo y política de retención
  - búsqueda semántica si $text resulta insuficiente en uso real
